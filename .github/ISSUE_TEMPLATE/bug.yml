name: Erro no site
description: Algo não funciona como deveria (página quebrada, login, e-mail, layout).
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problema
    attributes:
      label: O que aconteceu
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra ...
        2. Toque em ...
        3. Veja o erro
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Aparelho e navegador
      placeholder: "Android 15, Chrome / iPhone, Safari / Windows, Firefox"
  - type: textarea
    id: prints
    attributes:
      label: Prints ou mensagens de erro
