name: Resumo mensal

on:
  schedule:
    # Dia 1º às 10:07 de Brasília, depois da ingestão diária.
    - cron: "7 13 1 * *"
  workflow_dispatch:
    inputs:
      mes:
        description: "Mês no formato AAAA-MM (vazio = mês anterior)"
        required: false

concurrency: resumo-mensal

jobs:
  enviar:
    runs-on: ubuntu-latest
    # Partes em paralelo: cada usuário cai sempre na mesma parte (--parte k/n). Com milhões de usuários, o tempo
    # é limitado pela taxa de envio do Resend; aumente as partes junto com o limite da conta.
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_RESEND_KEY: ${{ secrets.AUTH_RESEND_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enviar
        run: |
          MES="${{ inputs.mes }}"
          npm run resumo-mensal -- --parte "${{ matrix.parte }}/4" ${MES:+--mes "$MES"}
